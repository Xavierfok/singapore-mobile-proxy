[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "singapore-mobile-proxy"
dynamic = ["version"]
description = "Scrapy middleware and Playwright helpers for Singapore 4G mobile proxies (Singtel, M1), with IP rotation on a status code, a schedule or on demand."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Singapore Mobile Proxy" }]
keywords = ["scrapy", "proxy", "mobile proxy", "singapore", "4g proxy", "rotating proxy", "playwright", "scrapy middleware", "web scraping", "socks5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Scrapy",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
scrapy = ["scrapy>=2.7"]
playwright = ["playwright>=1.30"]
test = ["pytest>=7", "scrapy>=2.7"]

[project.scripts]
singapore-proxy = "singapore_mobile_proxy.__main__:main"

# These show in the PyPI sidebar, so they are tagged as PyPI traffic.
[project.urls]
Homepage = "https://singaporemobileproxy.com/?utm_source=pypi&utm_medium=directory&utm_campaign=python_package"
"Free trial" = "https://singaporemobileproxy.com/client/trial?utm_source=pypi&utm_medium=directory&utm_campaign=python_package"
Source = "https://github.com/Xavierfok/singapore-mobile-proxy"
Issues = "https://github.com/Xavierfok/singapore-mobile-proxy/issues"

[tool.hatch.version]
path = "src/singapore_mobile_proxy/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]
exclude = ["examples/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
